name: Weekly Security Audit

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Dependency audit
        run: |
          # Torch currently has no published fixed version for CVE-2025-3000.
          # Keep the audit strict for any new or fixable findings, and remove
          # this ignore when an upstream patched release is available. Tracking: #108.
          uv run pip-audit --ignore-vuln CVE-2025-3000

      - name: Bandit scan
        run: uv run bandit -q -r src/scriptscore -x tests -ll
